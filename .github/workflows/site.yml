#
# iOS hub site — a GitHub Pages downloads page (site/build.py) listing the
# latest .ipa from BOTH repos:
#
#   SpencerGraffunder/pianobar-ios   (this repo, rolling release 'ios-latest')
#   SpencerGraffunder/key-decoder    (rolling release 'ios-latest')
#
# The page links directly to GitHub Release assets, which download as the
# BARE .ipa file (Actions run artifacts are always zip-wrapped and are not
# linked here on purpose).
#
# How it gets rebuilt:
#   workflow_call      — ios.yml runs this as the deploy-site job right after
#                        its release job publishes a .ipa (instant; also the
#                        only race-free way: the rolling 'ios-latest' release
#                        is ASSET-UPLOADED on refresh, which does not fire a
#                        release webhook)
#   schedule           — every 2 h, so key-decoder releases land here too
#                        (GITHUB_TOKEN cannot dispatch across repos; giving
#                        key-decoder a PAT with dispatch rights on this repo
#                        would make that instant)
#   workflow_dispatch  — manual "Run workflow"
#   repository_dispatch(site-refresh) — for authorized external pokes
#
name: site

on:
  workflow_call:
  workflow_dispatch:
  repository_dispatch:
    types: [ site-refresh ]
  schedule:
    - cron: '23 */2 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; newer pushes supersede older renders.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest release metadata (public API, unauthenticated)
        run: |
          mkdir -p releases
          for repo in SpencerGraffunder/pianobar-ios SpencerGraffunder/key-decoder; do
            slug=${repo##*/}
            # -f: fail on 404 (no release yet) — build.py renders "No release
            # yet" for missing files, so that is non-fatal here.
            curl -sfL "https://api.github.com/repos/${repo}/releases/latest" \
              -o "releases/${slug}.json" \
              || { echo "no release for ${repo} yet"; rm -f "releases/${slug}.json"; }
          done

      - name: Render site
        run: python3 site/build.py --releases-dir releases --out _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
