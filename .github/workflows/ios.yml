#
# iOS CI — build the pianobar iOS app (ios/) and produce an .ipa.
#
# Two jobs, split to keep Actions minutes low:
#
#   build    — on PRs and pushes to non-default branches that touch iOS
#              code: a fast compile check only. NO simulator tests,
#              no .ipa. (~2 min)
#
#   release  — on a push to the default branch (master), a tag push (v*),
#              or a manual "Run workflow" dispatch: the full pipeline —
#              unit tests on the iOS simulator, a Release build, an
#              unsigned .ipa (uploaded as a run artifact AND published
#              as a GitHub Release). Tag pushes
#              publish under their tag name; everything else refreshes
#              the rolling 'ios-latest' release (same tag, asset
#              replaced each push).
#
# Getting a new .ipa:
#   git push origin master                      (rolling 'ios-latest')
#   git tag v1.1.0 && git push origin v1.1.0    (pinned tag)
#   GitHub repo → Actions → ios → "Run workflow"
#
# To produce a *signed* .ipa instead, add the usual Apple secrets
# (certificates / provisioning profile) and swap the export step for
# `xcodebuild -exportArchive` with a matching ExportOptions.plist.
#
name: ios

on:
  push:
    branches: [ master ]
    paths:
      - 'ios/**'
      - 'src/libpiano/**'
      - '.github/workflows/ios.yml'
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'ios/**'
      - 'src/libpiano/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

# Needed to publish the .ipa as a release asset.
permissions:
  contents: write

jobs:
  # Fast compile check on PRs and pushes to non-default branches —
  # no tests, no .ipa. Default-branch pushes go straight to the
  # release job (which builds anyway) so we don't compile twice.
  build:
    if: >-
      (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') &&
       github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main') ||
      github.event_name == 'pull_request'
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate --spec project.yml

      - name: Compile check (Release, unsigned, no tests)
        run: |
          xcodebuild -project ios/Piano.xcodeproj -scheme PianoApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="-" \
            build

  # Full pipeline (tests + .ipa + release publish) — pushes to the
  # default branch, tag pushes, and manual "Run workflow" dispatches.
  release:
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'))
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -E 'iphonesimulator|iphoneos'

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate --spec project.yml

      - name: Run unit tests (iOS simulator)
        working-directory: ios
        run: |
          # xcodebuild test needs a *concrete* simulator; pick the first
          # available iPhone on this runner rather than hard-coding a name.
          SIM=$(xcrun simctl list devices available --json \
                | jq -r '.devices[] | .[] | select(.name | contains("iPhone")) | .name' \
                | head -1)
          echo "Using simulator: $SIM"
          xcodebuild -project Piano.xcodeproj -scheme PianoApp \
            -destination "platform=iOS Simulator,name=$SIM" \
            -derivedDataPath dd \
            CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO \
            test

      - name: Build Release for iOS device
        run: |
          xcodebuild -project ios/Piano.xcodeproj -scheme PianoApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath dd-device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="-" \
            build

      - name: Assemble .ipa
        run: |
          APP=$(find dd-device/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          echo "Bundling $APP"
          mkdir -p ipa-staging/Payload
          cp -R "$APP" ipa-staging/Payload/
          cd ipa-staging
          zip -qry ../pianobar-ios.ipa Payload
          cd ..
          ls -lh pianobar-ios.ipa

      # Also attach it to the run so it shows up in the Actions
      # "Artifacts" tab (download there is a .zip, but it's handy to
      # have the file right in the run). The GitHub Release below is
      # still the preferred download path because it's a bare .ipa.
      - name: Upload .ipa as run artifact
        uses: actions/upload-artifact@v4
        with:
          name: pianobar-ios.ipa
          path: pianobar-ios.ipa
          if-no-files-found: error

      - name: Publish .ipa as GitHub Release (bare file, no zip)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tag pushes publish under their tag name; manual dispatch
          # refreshes the rolling 'ios-latest' release. Release assets
          # download as the bare .ipa (Actions artifacts are always
          # zipped, which is why we don't use them for the .ipa).
          TAG=ios-latest
          if [ "$GITHUB_REF_NAME" != "master" ] && [ -n "$GITHUB_REF_NAME" ] && [ "${GITHUB_REF_NAME#v}" != "$GITHUB_REF_NAME" ]; then
            TAG="$GITHUB_REF_NAME"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" pianobar-ios.ipa --clobber
          else
            gh release create "$TAG" pianobar-ios.ipa \
              --title "iOS build ($TAG)" \
              --notes "Unsigned .ipa from CI. Re-sign with Sideloadly / AltStore / an ad-hoc profile to install."
          fi
          gh release view "$TAG"
